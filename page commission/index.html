<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>Je t'aime</title>
<link rel="icon" href="assets/heart.png">

<style>

#soundButton {
    position: absolute;

    left: 1804px;
    top: 911px;

    width: 35px;
    height: 35px;

    cursor: pointer;
    z-index: 5;
}

body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
}

#page {
    width: 1920px;
    height: 1080px;
    position: relative;
    margin: auto;
}


/* IMAGE PRINCIPALE */

#background {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;

    z-index: 3;
}


#planeVideo {

    position: absolute;

    left: -40px;
    top: 533px;

    width: 640px;
    height: 452px;

    object-fit: cover;

    z-index: 2;
}

/* ECRAN XP */

#loading {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(#0b3d91, #001b45);
    z-index: 10;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    color: white;

    opacity: 1;
    transition: opacity 1.5s ease;
}


/* LOGO */

#logo {
    width: 700px;
    margin-bottom: 80px;
}


/* TEXTE */

#loading p {
    font-size: 32px;
}


/* BOUTON */

#startButton {

    width: 200px;

    cursor: pointer;

    margin-top: 40px;

    user-select: none;

}

button:hover {
    background: white;
}

</style>

</head>


<body>

<div id="page">


<img id="background" src="assets/comi plane.png">

<video id="planeVideo" autoplay loop muted>
    <source src="assets/plane showcase.mp4" type="video/mp4">
</video>

<img id="soundButton" src="assets/sound.png">

<audio id="mouseSound" src="assets/mouse.mp3"></audio>

<audio id="startupSound" src="assets/startup.mp3"></audio>

<audio id="music" src="assets/music.mp3" loop></audio>


<div id="loading">

<img id="logo" src="assets/logo chargement.png">

<img id="loadingbar" src="assets/loading bar.gif">

<p>Chargement...</p>

<img 
    id="startButton" 
    src="assets/startbutton.png"
    onclick="startPage()"
>

</div>


</div>

<script>

function startPage() {

let button = document.getElementById("startButton");

button.src = "assets/startbuttonHOLD.png";

setTimeout(() => {

    button.src = "assets/startbutton.png";

}, 150);

    let mouse = document.getElementById("mouseSound");
    let startup = document.getElementById("startupSound");
    let music = document.getElementById("music");

    let loading = document.getElementById("loading");


    // volume bas
    mouse.volume = 0.25;
    startup.volume = 0.25;
    music.volume = 0;


    // clic XP
mouse.play();

setTimeout(() => {
    startup.play();
}, 300);


    // lancer la musique après le startup
    startup.onended = () => {

        music.play();

        // fade in musique
        let volume = 0;

        let fade = setInterval(() => {

            if (volume < 0.25) {

                volume += 0.01;
                music.volume = volume;

            } else {

                clearInterval(fade);

            }

        }, 100);

    };


    // fondu écran
    loading.style.opacity = "0";


    setTimeout(() => {

        loading.style.display = "none";

    }, 1500);

}

document.addEventListener("click", function() {

    let click = document.getElementById("mouseSound");

    click.currentTime = 0;
    click.volume = 0.25;
    click.play();

});

let muted = false;

document.getElementById("soundButton").addEventListener("click", function(event) {

    event.stopPropagation();

    let music = document.getElementById("music");
    let button = document.getElementById("soundButton");

    muted = !muted;

    music.muted = muted;


    if (muted) {

        button.src = "assets/soundOFF.png";

    } else {

        button.src = "assets/sound.png";

    }

});

</script>

</body>

</html>
